</b></font></div></h1>
<hr>

<a name="wp1058565"> </a><p><div align="right"><font color="#000000" face="Arial" size="2">
id0116008043c0
</font></div></p>

<a name="wp1058771"> </a><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">
	1.	Disconnect the negative battery cable.
</font></p>

<a name="wp1058575"> </a><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">
	2.	Remove the purge solenoid valve from air hose. (See <a  href="id0116008037c0.html#wp1025486">EMISSION SYSTEM LOCATION INDEX [ZY]</a>.)
</font></p>

<a name="wp1058593"> </a><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">
	3.	Install in the reverse order of removal.
</font></p>

<a name="wp1058695"> </a><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">
 
</font></p>

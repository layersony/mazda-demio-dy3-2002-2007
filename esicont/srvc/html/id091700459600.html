</b></font></div></h1>
<hr>

<a name="wp1058562"> </a><p><div align="right"><font color="#000000" face="Arial" size="2">
id091700459600
</font></div></p>

<a name="wp1059081"> </a><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">
	1.	Remove the front scuff plate.
</font></p>

<a name="wp1058572"> </a><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">
	2.	Remove the fastener.</font></p><p><table border="0" cellpadding="0" cellspacing="0"><img src="images/ADA7744W011.png" align="left" height="181" width="334" border="0" hspace="0" vspace="0"></table></p><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">



</font></p>

<a name="wp1058599"> </a><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">
	3.	Pull the front side trim outward, then disengage tab A and clip B.
</font></p>

<a name="wp1058609"> </a><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">
	4.	Remove the front side trim.
</font></p>

<a name="wp1058619"> </a><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">
	5.	Install in the reverse order of removal.
</font></p>

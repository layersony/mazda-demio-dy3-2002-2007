CIGARETTE LIGHTER INSPECTION
</b></font></div></h1>
<hr>

<a name="wp1058560"> </a><p><div align="right"><font color="#000000" face="Arial" size="2">
id092000803200
</font></div></p>

<a name="wp1058773"> </a><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">
	1.	Turn the ignition switch to the ACC position.
</font></p>

<a name="wp1058570"> </a><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">
	2.	Press the plug into the socket verify that the cigarette lighter comes out within <b>10-20 s</b>.
</font></p>
<dl>
<a name="wp1058591"> </a><dd><font color="Black" face="Arial, Helvetica, sans-serif" size="2">
&bull;&nbsp;If there is any malfunction, replace the cigarette lighter plug and socket. 
</font></dd>
</dl>

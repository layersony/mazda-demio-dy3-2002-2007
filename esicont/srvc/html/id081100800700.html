<a name="wp1025486"> </a><h1><div align="center"><font color="Black" face="Arial, Helvetica, sans-serif" size="5"><b>
REAR BUCKLE REMOVAL/INSTALLATION
</b></font></div></h1>
<hr>

<a name="wp1058562"> </a><p><div align="right"><font color="#000000" face="Arial" size="2">
id081100800700
</font></div></p>

<a name="wp1059062"> </a><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">
	1.	Fold the rear seat upward.
</font></p>

<a name="wp1058572"> </a><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">
	2.	Partially peel back the rear cushion trim.</font></p><p><table border="0" cellpadding="0" cellspacing="0"><img src="images/ADA7750W007.png" align="left" height="181" width="334" border="0" hspace="0" vspace="0"></table></p><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">



</font></p>

<a name="wp1058599"> </a><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">
	3.	Remove the bolts, and then remove the rear buckles.
</font></p>

<a name="wp1058609"> </a><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">
	4.	Install in the reverse order of removal.
</font></p>

<a name="wp1058960"> </a><p><font color="Black" face="Arial, Helvetica, sans-serif" size="2">
 
</font></p>
